
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Vertex Code</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="/static/assets/logo-withoutbg.png">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container-xl">

    <header class="contact-header">

        <a href="/">
            <img src="/static/assets/logo.svg"
                 alt="logo"
                 class="contact-logo">
        </a>

        <div class="contact-actions">

            <button type="reset"
                    form="contactForm"
                    class="icon-btn"
                    title="Clear Form">
                <i class="bi bi-arrow-counterclockwise"></i>
            </button>

            <a href="/"
               class="icon-btn"
               title="Close">
                <i class="bi bi-x-lg"></i>
            </a>

        </div>

    </header>

    <!-- Toast Notification -->
    <div id="toast" class="toast-popup" hidden>

        <button class="toast-close" type="button">&times;</button>

        <div class="toast-icon">
            ✓
        </div>

        <h3>Thank You!</h3>

        <p id="toast-message"></p>

    </div>

</div>

<section class="contact-hero">

    <img src="/static/assets/avatar.png"
         class="contact-avatar"
         alt="avatar">

    <h1 class="contact-title">
        Let's Work Together!
    </h1>

    <p class="contact-subtitle">
        I'd love to hear about your project or opportunity.
    </p>

</section>

<div class="contact-form-wrapper">

    <form method="POST"
          action="https://formspree.io/f/xoedypdb"
          class="contact-form"
          id="contactForm">

        <div class="row g-4">

            <div class="col-md-6">

                <label for="name" class="form-label">Name</label>

                <input type="text"
                       id="name"
                       name="name"
                       class="form-control contact-input"
                       required>

            </div>

            <div class="col-md-6">

                <label for="email" class="form-label">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control contact-input"
                       required>

            </div>

            <div class="col-12">

                <label for="message" class="form-label">Message</label>

                <textarea id="message"
                          name="message"
                          class="form-control contact-message"
                          required></textarea>

            </div>

            <div class="col-12 contact-submit">

                <button type="submit" class="btn-outline">
                    Send Message
                </button>

            </div>

        </div>

    </form>

</div>

<script>

const form = document.getElementById("contactForm");
const toast = document.getElementById("toast");
const toastMessage = document.getElementById("toast-message");

function showToast(message) {

    toastMessage.textContent = message;
    toast.hidden = false;

    setTimeout(() => {
        toast.hidden = true;
    }, 4000);

}

document.querySelector(".toast-close").addEventListener("click", () => {
    toast.hidden = true;
});

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const submitButton = form.querySelector('button[type="submit"]');

    submitButton.disabled = true;
    submitButton.textContent = "Sending...";

    try {

        const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: {
                "Accept": "application/json"
            }
        });

        if (response.ok) {

            form.reset();

            showToast("Your message has been sent successfully.");

        } else {

            showToast("Sorry, your message could not be sent. Please try again.");

        }

    } catch (error) {

        showToast("Something went wrong. Please check your connection and try again.");

    } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Send Message";

    }

});

</script>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
